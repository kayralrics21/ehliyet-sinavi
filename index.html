<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Ehliyet Deneme</title>
<style>*{box-sizing:border-box}
:root{--black:#000000;--red:#ff0000;--white:#ffffff;--green:#00d765}
html{scroll-behavior:auto;background:var(--black)}
body{margin:0;min-height:100vh;background:var(--black);color:var(--white);font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--white);outline-offset:3px}
button:disabled{cursor:default;opacity:.43}
.wrap{width:min(1120px,calc(100% - 36px));margin:0 auto}
.topbar{border-bottom:1px solid var(--red);background:var(--black)}
.topbar-inner{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-size:18px;letter-spacing:1.4px;font-weight:900;line-height:1.2}
.brand b{color:var(--red)}
.header-right{display:flex;align-items:center;gap:12px}
.small-label{color:var(--red);font-size:13px;font-weight:800;letter-spacing:.6px}
.timer{min-width:102px;border:1px solid var(--red);border-radius:9px;text-align:center;padding:8px 12px;color:var(--white);font-variant-numeric:tabular-nums;font-weight:900;font-size:19px}
.timer.urgent{background:var(--red);color:var(--black)}
.btn{border:1px solid var(--red);border-radius:10px;padding:11px 18px;font-weight:800;min-height:45px;display:inline-flex;justify-content:center;align-items:center;gap:8px;background:var(--black);color:var(--white);transition:background .15s,color .15s,border-color .15s}
.btn:hover:not(:disabled){background:var(--red);color:var(--black)}
.btn.red{background:var(--red);color:var(--black)}
.btn.red:hover:not(:disabled){background:var(--white);border-color:var(--white);color:var(--black)}
.btn.small{padding:7px 14px;min-height:37px;font-size:14px}
.home{padding:52px 0 58px}
.home h1{margin:0 0 28px;font-size:clamp(30px,5vw,46px);font-weight:900;letter-spacing:-1.5px}
.home h1 span{color:var(--red)}
.tests{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.test-card{min-height:166px;padding:22px;border:1px solid var(--red);border-radius:15px;background:var(--black);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:10px}
.test-card h2{font-size:23px;line-height:1.2;margin:0;letter-spacing:-.5px}
.test-card .brief{font-size:13px;color:var(--white);opacity:.85}
.test-card .btn{width:100%;margin-top:4px}
.test-card.active{box-shadow:inset 0 0 0 1px var(--red)}
.test-card.active h2{color:var(--red)}
.content{padding:32px 0 56px}
.exam-card,.finish-card{background:var(--black);border:1px solid var(--red);border-radius:16px;padding:clamp(18px,3vw,36px)}
.exam-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;color:var(--red);font-weight:900;font-size:14px}
.question{font-size:clamp(19px,2.7vw,26px);font-weight:800;line-height:1.5;margin:0 0 24px;white-space:pre-wrap;overflow-wrap:anywhere}
.figure{margin:0 0 24px;padding:12px;border:1px solid var(--red);border-radius:12px;text-align:center;background:var(--black)}
.figure img{max-width:100%;width:auto;max-height:310px;height:auto;object-fit:contain;display:block;margin:auto}
.options{display:grid;gap:11px}
.option{display:flex;align-items:flex-start;gap:14px;text-align:left;width:100%;background:var(--black);color:var(--white);border:1px solid var(--red);border-radius:10px;padding:16px;min-height:62px;transition:background .1s}
.option:hover:not(:disabled){background:var(--red);color:var(--black)}
.option:disabled{opacity:1;cursor:default}
.option .letter{width:32px;height:32px;display:flex;flex:0 0 32px;align-items:center;justify-content:center;border:1px solid var(--red);border-radius:7px;color:var(--red);font-size:15px;font-weight:900}
.option .answer-text{padding-top:3px;overflow-wrap:anywhere}
.option.correct{border:2px solid var(--green);padding:15px}
.option.correct .letter{color:var(--black);background:var(--green);border-color:var(--green)}
.option.wrong{background:var(--red);color:var(--black);border:2px solid var(--red);padding:15px}
.option.wrong .letter{color:var(--black);border-color:var(--black)}
.feedback{margin-top:18px;font-size:16px;font-weight:900}
.feedback.good{color:var(--green)}
.feedback.bad{color:var(--red)}
.actions{display:flex;flex-wrap:wrap;justify-content:space-between;gap:11px;margin-top:25px}
.actions>div{display:flex;flex-wrap:wrap;gap:11px}
.number-nav{display:grid;grid-template-columns:repeat(10,1fr);gap:8px;margin-top:20px}
.number-nav button{min-width:0;min-height:42px;border:1px solid var(--red);border-radius:7px;background:var(--black);color:var(--white);font-size:14px;font-weight:800;padding:5px}
.number-nav button.current{background:var(--red);color:var(--black)}
.number-nav button.answered:not(.current){color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.finish-card{max-width:730px;margin:28px auto 0;text-align:center;padding:clamp(24px,6vw,54px)}
.finish-card .test-number{font-size:14px;letter-spacing:1.5px;font-weight:900;color:var(--red)}
.finish-card .score{font-size:clamp(60px,12vw,104px);line-height:1;font-weight:900;letter-spacing:-4px;margin:18px 0 21px}
.finish-card .score small{font-size:25px;letter-spacing:0;color:var(--red)}
.result-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:25px 0}
.result-stat{border:1px solid var(--red);border-radius:9px;padding:15px 8px}
.result-stat strong{display:block;font-size:28px;line-height:1.2}
.result-stat span{font-size:13px}
.result-stat .good{color:var(--green)}
.result-stat .bad{color:var(--red)}
.result-msg{font-size:clamp(17px,2.4vw,21px);font-weight:800;line-height:1.6;margin:20px 0 27px}
.result-msg.good{color:var(--green)}
.result-msg.bad{color:var(--red)}
.result-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.footer{padding:24px 0 30px;text-align:center;color:var(--red);font-size:12px;font-weight:800;letter-spacing:1px}
@media(max-width:840px){.tests{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:600px){.wrap{width:calc(100% - 28px)}.topbar-inner{min-height:68px}.brand{font-size:15px;letter-spacing:.5px}.timer{min-width:80px;font-size:15px;padding:8px 7px}.small-label{font-size:12px}.header-right{gap:7px}.header-right .btn{font-size:12px;padding:7px 10px;min-height:34px}.home{padding-top:30px}.home h1{margin-bottom:19px}.tests{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.test-card{min-height:145px;padding:15px}.test-card h2{font-size:20px}.test-card .brief{font-size:12px}.content{padding-top:18px}.exam-card{padding:17px}.exam-bar{margin-bottom:12px}.question{font-size:20px;margin-bottom:18px}.option{padding:12px;min-height:59px;gap:10px}.option.correct,.option.wrong{padding:11px}.actions{gap:10px}.actions>.btn,.actions>div{flex:1}.actions>div>.btn{flex:1}.number-nav{grid-template-columns:repeat(5,1fr);gap:6px}.number-nav button{min-height:41px}.result-stats{gap:6px}.result-stat strong{font-size:24px}.result-stat span{font-size:12px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>"use strict";
const TESTS=[{"id":1,"title":"Test 1","durationMinutes":45,"passCorrect":35,"questions":[{"text":"Aşağıdaki ışıklı işaretlerden hangisinde sürücü durur, yolu kontrol eder ve ardından geçer?","choices":["Aralıklı olarak yanıp sönen sarı ışıkta","Aralıklı olarak yanıp sönen kırmızı ışıkta","Sürekli yanan sarı ışıkta","Sürekli yanan kırmızı ışıkta"],"category":"Trafik ve Çevre Bilgisi","correct":1},{"text":"Taşıt yolunun sol şeridinde aşağıdakilerden hangisinin yapılması yasaktır?","choices":["Yavaşlamak","Yolcu indirip bindirmek","Vites küçültmek","Trafik gereği durmak"],"category":"Trafik ve Çevre Bilgisi","correct":1},{"text":"Park için ayrılmış bir yerde kurallara uygun park edilmiş bir araca çarpan sürücü, Karayolları Trafik Yönetmeliği'ne göre hangi kusuru işlemiş sayılır?","choices":["Kusursuz sayılır","Kusur iki sürücü arasında paylaştırılır","Asli kusur","Tali kusur"],"category":"Trafik ve Çevre Bilgisi","correct":2},{"text":"Canlıların karşılıklı etkileşim içinde bulunduğu doğal ve fiziksel unsurların tamamından oluşan dış ortama ne ad verilir?","choices":["Çevre","İklim","Atık","Erozyon"],"category":"Trafik ve Çevre Bilgisi","correct":0},{"text":"Duraklama ya da park yerinden ayrılan bir sürücünün uyması gereken kurallar arasında aşağıdakilerden hangisi yer almaz?","choices":["Aracın çevresini kontrol etmek","Tehlike yoksa manevraya başlamak","Işıkla ya da kolla çıkış işareti vermek","Yoldan geçen sürücüleri uyararak yavaşlatmak"],"category":"Trafik ve Çevre Bilgisi","correct":3},{"text":"Araçlar için \"duraklama\" kavramına uyan durum aşağıdakilerden hangisidir?","choices":["Beş dakikadan uzun süre beklemek","Görevlinin işaretiyle durmak","Yolcu indirmek için kısa süre beklemek","Kırmızı ışıkta beklemek"],"category":"Trafik ve Çevre Bilgisi","correct":2},{"text":"Arıza nedeniyle kara yolunda kalan bir araç için aşağıdakilerden hangisinin yapılması gerekir?","choices":["Uzağı gösteren farların yakılı tutulması","Araç kapılarının açık bırakılması","Aracın önüne ve arkasına birer yansıtıcı (reflektör) konulması","Vitesin boşa alınması"],"category":"Trafik ve Çevre Bilgisi","correct":2},{"text":"Kavşakta görev yapan trafik polisi kollarını iki yana açmış durumdaysa trafik akışı nasıl olur?","choices":["Yol bütün yönlere açıktır","Yol, polisin ön ve arka tarafındaki trafiğe açıktır","Yol bütün yönlere kapalıdır","Yol, polisin kollarının gösterdiği yönlerdeki trafiğe açıktır"],"category":"Trafik ve Çevre Bilgisi","correct":3},{"text":"Aşağıdaki sürücü davranışlarından hangisi bir trafik kuralı ihlalidir?","choices":["Öndeki aracı güvenli bir mesafeden izlemek","Gidiş yönündeki sağ şeridi izlemek","Yaya ve okul geçitlerine yaklaşırken yavaşlamak","Araç hareket hâlindeyken cep telefonunu elde tutarak konuşmak"],"category":"Trafik ve Çevre Bilgisi","correct":3},{"text":"Trafiğe çıkan bir araçta Araç Tescil Belgesinin yanında hangi belgenin de bulundurulması gerekir?","choices":["Motorlu Araç Trafik Belgesi","Kasko poliçesi","Satış faturası","Servis bakım belgesi"],"category":"Trafik ve Çevre Bilgisi","correct":0},{"text":"Yaya ve okul geçitlerinde aşağıdakilerden hangisinin yapılması yasak değildir?","choices":["Öndeki aracı geçmek","Duraklamak","Park etmek","Durmak"],"category":"Trafik ve Çevre Bilgisi","correct":3},{"text":"Trafik kazasına karışan ancak yaralanmayan bir sürücünün yapmakla yükümlü olduğu davranış hangisidir?","choices":["Yansıtıcılarla kaza yerini işaretlemek","Yolu hemen trafiğe açmak","Kazaya ait iz ve delilleri ortadan kaldırmak","Akan trafiği kontrol altına almak"],"category":"Trafik ve Çevre Bilgisi","correct":0},{"text":"Aşağıdakilerden hangisi araç kaynaklı çevre kirliliğinin azalmasına katkı sağlar?","choices":["Araç bakımlarının düzenli olarak yaptırılması","Trafik akışının çok yavaş olması","Kurşun oranı yüksek yakıt kullanılması","Delik bir egzozla yola çıkılması"],"category":"Trafik ve Çevre Bilgisi","correct":0},{"text":"Tehlikeli eğimli dar bir yolda karşılaşan iki araçtan yokuş yukarı çıkan aracın geçişi zorsa, yokuş aşağı inen aracın sürücüsü ne yapmalıdır?","choices":["Varsa sığınma cebine girmeli, yoksa yolun sağına yanaşıp durmalıdır","Motoru durdurup araçtan inmelidir","Çıkan aracı geri gitmeye zorlamalıdır","Çıkan aracın sürücüsünü uyarıp yoluna devam etmelidir"],"category":"Trafik ve Çevre Bilgisi","correct":0},{"text":"İki veya daha fazla karayolunun kesişmesi ya da birleşmesiyle oluşan ortak alana ne ad verilir?","choices":["Dönemeç","Kavşak","Bağlantı yolu","Ada"],"category":"Trafik ve Çevre Bilgisi","correct":1},{"text":"Hangi durumda önünüzdeki araçları sağ taraflarından geçmeniz kurallara uygundur?","choices":["Yavaş giden araçları geçerken","Konvoy hâlinde giden araçları geçerken","Trafiğin zorunlu kıldığı nedenlerle bekleyen araçları geçerken","Yokuş yukarı çıkan yollarda ilerleyen araçları geçerken"],"category":"Trafik ve Çevre Bilgisi","correct":2},{"text":"Sürücünün aracıyla geri gitmesine hangi durumda izin verilir?","choices":["İki yönlü dar yolda karşıdan gelen araca geçiş kolaylığı sağlamak için","Tek yönlü yolda duraklama manevrası dışında","Bağlantı yollarında","Tek yönlü yolda park manevrası dışında"],"category":"Trafik ve Çevre Bilgisi","correct":0},{"text":"Manevraya başlamak üzere olan bir sürücünün öncelikle yapması gereken nedir?","choices":["Manevraya başladıktan sonra işaret vermek","Önündeki, arkasındaki ve yanlarındaki trafiği kontrol etmek","İşaret verir vermez manevraya başlamak","Manevra tamamlanmadan işareti kapatmak"],"category":"Trafik ve Çevre Bilgisi","correct":1},{"text":"Şehirler arası ticari yük veya yolcu taşımacılığı yapan bir sürücü, ara vermeden en fazla kaç saat araç kullanabilir?","choices":["5,5","3,5","2,5","4,5"],"category":"Trafik ve Çevre Bilgisi","correct":3},{"text":"Araçların yüklü veya yüksüz olarak karayolunda güvenle seyredebilmesi için belirlenen uzunluk, genişlik ve yükseklik ölçülerine ne ad verilir?","choices":["Dingil ağırlığı","Azami yüklü ağırlık","Taşıma sınırı","Gabari"],"category":"Trafik ve Çevre Bilgisi","correct":3},{"text":"Yerleşim yeri dışındaki bir kavşağa yaklaşan sürücü, kavşağa kaç metre kala şerit değiştiremez?","choices":["250","300","200","150"],"category":"Trafik ve Çevre Bilgisi","correct":3},{"text":"Lastik tekerlekli traktörle ilgili aşağıdaki bilgilerden hangisi yanlıştır?","choices":["Tarım işlerinde kullanılabilir","Ticari amaçla yük taşıması izne bağlıdır","Römorktaki yükün üzerinde insan taşıyabilir","Römork veya yarı römork çekebilir"],"category":"Trafik ve Çevre Bilgisi","correct":2},{"text":"Bir sürücü sağa veya sola dönerken aşağıdakilerden hangisini yapmakla yükümlüdür?","choices":["Arkadan gelen bütün araçlara yol vermek","Dönüş niyetini sinyal lambasıyla önceden belli etmek","Sinyal verir vermez aniden şerit değiştirmek","Dönmeye başladıktan sonra sinyal vermek"],"category":"Trafik ve Çevre Bilgisi","correct":1},{"text":"Aşağıdaki yaralılardan hangisinin ayaklarını yükselterek şok pozisyonu vermek sakıncalıdır?","choices":["Burnundan ve kulağından kanama olan yaralının","Bacağında açık kırık ve kanaması olan yaralının","El bileğinde açık kırık ve kanaması olan yaralının","Tansiyonu düşük ve nabzı zor alınan yaralının"],"category":"İlk Yardım","correct":0},{"text":"Sindirim yoluyla oluşan zehirlenmelerde aşağıdaki uygulamalardan hangisi yanlıştır?","choices":["Zehirlenmeye neden olan maddeyi belirlemeye çalışmak","Bilinci kapalı kişiyi kusturmamak","Besin zehirlenmesinde üzerinden 2 saat geçmişse kişiyi hemen kusturmak","Kostik madde içen kişiyi kusturmamak"],"category":"İlk Yardım","correct":2},{"text":"Aşağıdakilerden hangisi kanda oksijen azalmasının sonucu olarak ortaya çıkan belirtilerden biri değildir?","choices":["Düzensiz nabız","Kansızlık (anemi)","Bilinç kaybı","Baş dönmesi"],"category":"İlk Yardım","correct":1},{"text":"Burkulma yaşayan bir kişiye yapılan uygulamalardan hangisi yanlıştır?","choices":["Burkulan bölgeyi dinlendirmek","Burkulan bölgeyi yukarıda tutmak","Bölgeye buz torbası koymak","Burkulan bölgeye sıcak uygulama yapmak"],"category":"İlk Yardım","correct":3},{"text":"Kazalı bir araçtan yaralıyı çıkarırken en çok neye dikkat edilmelidir?","choices":["Kazalı araca zarar verilmemesine","Olayı izleyenlerin uzaklaştırılmasına","Mümkün olduğunca hızlı ve aceleci davranılmasına","Yaralıda yeni bir yaralanma oluşmamasına"],"category":"İlk Yardım","correct":3},{"text":"Kişinin çevresiyle bağlantısının tamamen koptuğu ve hiçbir uyarana yanıt veremediği derin bilinç kaybı durumuna ne ad verilir?","choices":["Bayılma","Halsizlik","Koma","Şok"],"category":"İlk Yardım","correct":2},{"text":"Bir yanığın derecesi belirlenirken en çok neye bakılır?","choices":["Yakıcı maddenin miktarına","Kişinin üzerindeki giysilerin cinsine","Yakıcı maddeyle temasın şekline","Yanan alanın genişliğine ve yanığın derinliğine"],"category":"İlk Yardım","correct":3},{"text":"Aşağıdaki kazazedelerden hangisinin taşınmasında sedye kullanılması kesinlikle gereklidir?","choices":["Omurgası kırık olanın","Birinci derece yanığı olanın","Kolunda yara ve kırık olanın","Kaburgası kırık olanın"],"category":"İlk Yardım","correct":0},{"text":"Bilinci açık bir kişinin az önce asit, baz ya da ne olduğu bilinmeyen kimyasal bir sıvı içtiği anlaşılıyor. Bu durumda ilk yardım olarak hangisi yapılır?","choices":["Sarımsaklı yoğurt yedirilir","Kişi açık havaya çıkarılır","Su içirilerek kimyasal madde sulandırılır","Kişi kusturulur"],"category":"İlk Yardım","correct":2},{"text":"Kanayan bölge kalp seviyesinden yukarıda tutulduğunda ne olur?","choices":["Beyin kanaması riski artar","Kalbin atım sayısı artar","Atardamarlardan nabız alınamaz","Kanayan bölgedeki kan basıncı düşer ve kanama azalır"],"category":"İlk Yardım","correct":3},{"text":"Sıcak çarpmasında görülen bitkinlik esas olarak neden kaynaklanır?","choices":["Kan dolaşımının yavaşlamasından","Sindirim sisteminin çalışmamasından","Nabız sayısının azalmasından","Terlemeyle vücudun aşırı su ve tuz kaybetmesinden"],"category":"İlk Yardım","correct":3},{"text":"Omuz veya koldan kaynaklanan kanamalarda basınç uygulanacak nokta neresidir?","choices":["Çene altı","Köprücük kemiğinin iç kısmı","Kasığın iç kısmı","Şakak"],"category":"İlk Yardım","correct":1},{"text":"Aracın belirli bir yolu gidebilmesine yetecek yakıtın araç üzerinde saklandığı bölüm hangisidir?","choices":["Bagaj","Karter","Torpido","Yakıt deposu"],"category":"Motor ve Araç Tekniği","correct":3},{"text":"Kontak anahtarı araçta hangi görevi üstlenir?","choices":["Elektrik devresini açıp kapatmak","Aküyü şarj etmek","Vites değiştirmeyi kolaylaştırmak","Bujilere giden akımı yükseltmek"],"category":"Motor ve Araç Tekniği","correct":0},{"text":"Benzinli bir motorda sıkıştırılmış karışımı tutuşturacak elektrik kıvılcımını hangi parça oluşturur?","choices":["Buji","Flaşör","Regülatör","Enjektör"],"category":"Motor ve Araç Tekniği","correct":0},{"text":"Sürücü el frenini indirmeyi unutup yola devam ederse hangi sorun ortaya çıkar?","choices":["Fren balataları ve kampanalar zarar görür.","Fren sisteminin hidroliği artar.","Akü boşalır.","Fren sisteminde hava oluşur."],"category":"Motor ve Araç Tekniği","correct":0},{"text":"Marşa basıldığında marş motoru hiç dönmüyorsa bunun en olası nedeni hangisidir?","choices":["Yakıtın bitmiş olması","Bujilere akım gitmemesi","Akünün boşalmış olması","Termostatın arızalanması"],"category":"Motor ve Araç Tekniği","correct":2},{"text":"Motorun soğutma sistemiyle ilgili yapılması gereken kontrol aşağıdakilerden hangisidir?","choices":["Antifriz kontrolü","Hidrolik yağ seviyesinin kontrolü","Motor yağı seviyesinin kontrolü","Akü elektrolit seviyesinin kontrolü"],"category":"Motor ve Araç Tekniği","correct":0},{"text":"Gösterge panelindeki devir saati (takometre) sürücüye hangi bilgiyi verir?","choices":["Aracın toplam kat ettiği yolu","Uzun farların açık olduğunu","Motorun dakikadaki devir sayısını","Aracın saatteki hızını"],"category":"Motor ve Araç Tekniği","correct":2},{"text":"Buji, Piston, Silindir kapağı. Verilen parçalar aş IAGAAABDQAAAhoAAAQ0AAAgoAEAQEADAICABgAAAQ0AAAIaAAAENAAAIKABAEBAAwCAgAYAAAENAAACGgAABDQAACCgAQBAQAMAgIAGAAABDQAAAhoAAAQ0AAAgoAEAQEADAICABgAAAQ0AAAIaAAAENAAAIKABAEBAAwBAGP8PO7m2YdiKMAQAAAAASUVORK5CYII="};
const KEY="ehliyet-deneme-26-minimal-v1";
const LEGACY_KEY="ehliyet-deneme-26-local-v1";
const LETTERS=["A","B","C","D"];
const $=(selector)=>document.querySelector(selector);
const safe=(text)=>String(text??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const testById=(id)=>TESTS.find(test=>test.id===id);
const validAnswers=(answers)=>Array.isArray(answers)&&answers.length===50&&answers.every(x=>x===null||(Number.isInteger(x)&&x>=0&&x<=3));
const cleanSession=(session)=>{
 if(!session||!Number.isInteger(session.testId)||!testById(session.testId)||!validAnswers(session.answers))return null;
 return {testId:session.testId,index:Number.isInteger(session.index)?Math.min(49,Math.max(0,session.index)):0,
 answers:session.answers.slice(),deadline:Number.isFinite(session.deadline)?session.deadline:Date.now()+2700000};
};
function load(){
 try{
  const fresh=localStorage.getItem(KEY);
  if(fresh)return cleanSession(JSON.parse(fresh));
  const legacy=localStorage.getItem(LEGACY_KEY);
  if(legacy)return cleanSession(JSON.parse(legacy)?.active);
 }catch(error){}
 return null;
}
let active=load();
let screen="home";
let latest=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(active))}catch(error){}}
function grade(test,answers){
 let correct=0,wrong=0,blank=0;
 answers.forEach((answer,i)=>{if(answer===null)blank++;else if(answer===test.questions[i].correct)correct++;else wrong++});
 return {correct,wrong,blank,score:correct*2,passed:correct>=test.passCorrect};
}
function timeRemaining(){return active?Math.max(0,active.deadline-Date.now()):0}
function timeText(ms){const s=Math.ceil(ms/1000);return `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`}
const footer=()=>'<footer class="footer">KAYRA HAN AYDOĞAN</footer>';
function header(){
 const onExam=screen==="exam"&&active;
 return `<header class="topbar"><div class="wrap topbar-inner"><div class="brand">EHLİYET <b>DENEME</b></div><div class="header-right">${onExam?`<div class="timer" id="timer" role="timer">${timeText(timeRemaining())}</div><button class="btn small" data-action="home">Çıkış</button>`:screen!=="home"?'<button class="btn small" data-action="home">Testler</button>':''}</div></div></header>`;
}
function homeView(){
 const cards=TESTS.map(t=>{
 const isActive=active?.testId===t.id;
 return `<article class="test-card ${isActive?'active':''}"><h2>Test ${t.id}</h2><div class="brief">50 soru · 45 dakika</div><button class="btn ${isActive?'':'red'}" data-action="start" data-id="${t.id}">${isActive?'Devam et':'Başla'}</button></article>`;
 }).join("");
 return `${header()}<main class="wrap home"><h1>DENEME <span>TESTLERİ</span></h1><section class="tests">${cards}</section></main>${footer()}`;
}
function examView(){
 if(!active)return homeView();
 const t=testById(active.testId);
 const i=active.index;
 const q=t.questions[i];
 const selected=active.answers[i];
 const locked=selected!==null;
 const choices=q.choices.map((choice,k)=>{
  const state=locked?(k===q.correct?'correct':k===selected?'wrong':''):'';
  return `<button type="button" class="option ${state}" data-action="answer" data-index="${k}" ${locked?'disabled':''}><span class="letter">${LETTERS[k]}</span><span class="answer-text">${safe(choice)}</span></button>`;
 }).join("");
 const feedback=locked?`<div class="feedback ${selected===q.correct?'good':'bad'}" role="status">${selected===q.correct?'Doğru':'Yanlış'} · Doğru cevap: ${LETTERS[q.correct]}</div>`:'';
 const figure=q.image?`<figure class="figure"><img alt="Soru görseli" src="${FIGURES[q.image]}"></figure>`:'';
 const nav=t.questions.map((_,index)=>`<button type="button" class="${index===i?'current':''} ${active.answers[index]!==null?'answered':''}" data-action="jump" data-index="${index}" aria-label="${index+1}. soru" ${index===i?'aria-current="step"':''}>${index+1}</button>`).join('');
 return `${header()}<main class="wrap content"><section class="exam-card"><div class="exam-bar"><span>TEST ${t.id}</span><span>SORU ${i+1} / 50</span></div><h1 class="question">${safe(q.text)}</h1>${figure}<div class="options">${choices}</div>${feedback}<div class="actions"><button class="btn" data-action="prev" ${i===0?'disabled':''}>Önceki</button><div><button class="btn" data-action="next" ${i===49?'disabled':''}>Sonraki</button><button class="btn red" data-action="finish">Bitir</button></div></div><nav class="number-nav" aria-label="Sorular">${nav}</nav></section></main>${footer()}`;
}
function resultView(){
 if(!latest)return homeView();
 const r=latest;
 const message=r.passed?'tebrikler, deneme sınavını geçtiniz. - KAYRA HAN AYDOĞAN':'maalesef, deneme sınavını kazanamadınız. bir dahaki sefere! - KAYRA HAN AYDOĞAN';
 return `${header()}<main class="wrap content"><section class="finish-card"><div class="test-number">TEST ${r.testId} · SONUÇ</div><div class="score">${r.score}<small> / 100</small></div><div class="result-stats"><div class="result-stat"><strong class="good">${r.correct}</strong><span>Doğru</span></div><div class="result-stat"><strong class="bad">${r.wrong}</strong><span>Yanlış</span></div><div class="result-stat"><strong>${r.blank}</strong><span>Boş</span></div></div><p class="result-msg ${r.passed?'good':'bad'}">${message}</p><div class="result-actions"><button class="btn" data-action="home">Testler</button><button class="btn red" data-action="start" data-id="${r.testId}">Tekrar çöz</button></div></section></main>${footer()}`;
}
function render(preserve=false){
 const y=preserve?window.scrollY:0;
 $('#app').innerHTML=screen==='home'?homeView():screen==='exam'?examView():resultView();
 if(!preserve)window.scrollTo(0,0);else window.scrollTo(0,y);
 updateTimer();
}
function start(id){
 const test=testById(id);
 if(!test)return;
 if(active&&active.testId===id){screen='exam';render();return;}
 if(active&&active.answers.some(a=>a!==null)&&!window.confirm('Yarım kalan test silinsin mi?'))return;
 active={testId:id,index:0,answers:Array(50).fill(null),deadline:Date.now()+test.durationMinutes*60000};
 latest=null;
 save();
 screen='exam';
 render();
}
function answer(index){
 if(screen!=='exam'||!active)return;
 if(timeRemaining()===0){finish(true);return;}
 if(active.answers[active.index]!==null||!Number.isInteger(index)||index<0||index>3)return;
 active.answers[active.index]=index;
 save();
 render(true);
}
function jump(index){
 if(screen!=='exam'||!active||!Number.isInteger(index)||index<0||index>=50)return;
 if(timeRemaining()===0){finish(true);return;}
 active.index=index;
 save();
 render();
}
function finish(auto=false){
 if(!active)return;
 if(!auto){const blanks=active.answers.filter(a=>a===null).length;if(!window.confirm(blanks?`${blanks} soru boş. Testi bitir?`:'Testi bitir?'))return;}
 const test=testById(active.testId);
 latest={testId:active.testId,...grade(test,active.answers)};
 active=null;
 save();
 screen='result';
 render();
}
function updateTimer(){
 if(!active)return;
 if(timeRemaining()<=0){finish(true);return;}
 const el=$('#timer');
 if(el){el.textContent=timeText(timeRemaining());el.classList.toggle('urgent',timeRemaining()<5*60000);}
}
$('#app').addEventListener('click',e=>{
 const button=e.target.closest('button[data-action]');if(!button)return;
 const action=button.dataset.action;
 const id=Number(button.dataset.id);
 const index=Number(button.dataset.index);
 if(action==='home'){screen='home';render();}
 else if(action==='start')start(id);
 else if(action==='answer')answer(index);
 else if(action==='jump')jump(index);
 else if(action==='prev')jump(active.index-1);
 else if(action==='next')jump(active.index+1);
 else if(action==='finish')finish();
});
document.addEventListener('keydown',e=>{
 if(screen!=='exam'||!active||e.altKey||e.metaKey||e.ctrlKey||e.target.closest('input,textarea,select,[contenteditable]'))return;
 if(/^[1-4]$/.test(e.key))answer(Number(e.key)-1);
 else if(e.key==='ArrowLeft'){e.preventDefault();jump(active.index-1)}
 else if(e.key==='ArrowRight'){e.preventDefault();jump(active.index+1)}
});
window.addEventListener('focus',updateTimer);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateTimer()});
setInterval(updateTimer,1000);
render();
</script>
</body>
</html>
